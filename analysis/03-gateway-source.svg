<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5a6478"/></marker>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#d64545"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2e9e5b"/></marker>
  </defs>
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2433">河南卫视网关型源 —— 结构与卡顿机制</text>
  <text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#5a6478">美国中转网关 302 到带时间签名的落地后端；修复后 token 一次学习即固化，整个会话锁定同一台后端</text>

  <!-- client -->
  <rect x="50" y="210" width="130" height="72" rx="12" fill="#eef2f9" stroke="#8fa3c4"/>
  <text x="115" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2433">电视 / App</text>
  <text x="115" y="260" text-anchor="middle" font-size="11" fill="#5a6478">ExoPlayer</text>

  <!-- gateway -->
  <rect x="280" y="200" width="170" height="92" rx="12" fill="#fbf3e6" stroke="#d9a85f"/>
  <text x="365" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5a1f">网关 107.150.60.122</text>
  <text x="365" y="248" text-anchor="middle" font-size="11" fill="#8a5a1f">live/hawshd.m3u8</text>
  <text x="365" y="266" text-anchor="middle" font-size="11" fill="#8a5a1f">每请求 302 → 轮询后端</text>

  <!-- backend A -->
  <rect x="580" y="110" width="290" height="112" rx="12" fill="#f4faf6" stroke="#79c799"/>
  <text x="725" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6b40">后端 A · 198.204.233.130:82（~92%）</text>
  <text x="725" y="158" text-anchor="middle" font-size="11.5" fill="#2c6e4c">窗口 3 × 10s ＝ 30s · 分片规整</text>
  <text x="725" y="178" text-anchor="middle" font-size="11.5" fill="#2c6e4c">seq ≈ 483xx · haws/segment_NNNNN.ts</text>
  <text x="725" y="200" text-anchor="middle" font-size="11" fill="#5a6478">落地 URL 带 jsbt/jsbk 时间签名（≥8 分钟有效）</text>

  <!-- backend B -->
  <rect x="580" y="270" width="290" height="104" rx="12" fill="#fbf6f6" stroke="#d69090"/>
  <text x="725" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a2f2f">后端 B · 173.208.146.10:88（偶发 ~8%）</text>
  <text x="725" y="318" text-anchor="middle" font-size="11.5" fill="#8a4a4a">分片 16.67s（时长翻倍！）</text>
  <text x="725" y="338" text-anchor="middle" font-size="11.5" fill="#8a4a4a">seq ≈ 207xx（独立序列号体系）</text>
  <text x="725" y="358" text-anchor="middle" font-size="11" fill="#5a6478">落在它上面 = 时间轴错乱一次</text>

  <!-- arrows -->
  <line x1="180" y1="246" x2="276" y2="246" stroke="#5a6478" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="450" y1="230" x2="576" y2="172" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="450" y1="262" x2="576" y2="316" stroke="#d64545" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/>
  <text x="516" y="182" text-anchor="middle" font-size="11" fill="#2e9e5b" font-weight="700">302（多数）</text>
  <text x="512" y="306" text-anchor="middle" font-size="11" fill="#d64545" font-weight="700">302（偶发轮换）</text>

  <!-- problem box -->
  <rect x="40" y="396" width="400" height="100" rx="10" fill="#fbf6f6" stroke="#e8c9c9"/>
  <text x="60" y="422" font-size="13" font-weight="700" fill="#8a2f2f">修复前的三种卡顿形态</text>
  <text x="60" y="444" font-size="11.5" fill="#8a4a4a">① 跨洋带宽波动：需求 3.4Mbps，实测 5.2~9.6Mbps（富余 1.0~2.8x），贴 1.0x 即击穿</text>
  <text x="60" y="464" font-size="11.5" fill="#8a4a4a">② 后端轮换：偶发落到 B → seq 突变 + 分片时长翻倍 → 时间轴错乱</text>
  <text x="60" y="484" font-size="11.5" fill="#8a4a4a">③ 切台初期垫片薄：起播垫 ~2 片，链路贴线时首 1~2 分钟最脆弱</text>

  <!-- fix box -->
  <rect x="478" y="396" width="402" height="100" rx="10" fill="#f4faf6" stroke="#bfe3cd"/>
  <text x="498" y="422" font-size="13" font-weight="700" fill="#1f6b40">修复后（RedirectMemory + 垫片策略）</text>
  <text x="498" y="444" font-size="11.5" fill="#1f6b40">✓ token 型落地一次学习即固化 → playlist / 分片整场锁定同一后端（后端粘性）</text>
  <text x="498" y="464" font-size="11.5" fill="#1f6b40">✓ 固化失败就地回退网关拿新 token（播放器无感知）；一次性 token 拉黑 10 分钟</text>
  <text x="498" y="484" font-size="11.5" fill="#1f6b40">✓ 低富余源垫到窗口 2/3：真机 240s 零错误 / 零掉帧 / 零重缓冲</text>
</svg>
