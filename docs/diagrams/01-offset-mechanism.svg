<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5a6478"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#d64545"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2e9e5b"/></marker>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2433">切台后前几个分片卡顿 —— 起播位置机制</text>
  <text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#5a6478">固定 3000ms 偏移覆盖了 media3 直播默认值，把起播点钉在直播边缘；按源画像在分片边界定位后身后再无"薄垫被击穿"</text>

  <!-- ===== Panel A: 旧策略 ===== -->
  <rect x="40" y="82" width="840" height="212" rx="12" fill="#fbf6f6" stroke="#e8c9c9"/>
  <text x="60" y="110" font-size="14.5" font-weight="700" fill="#8a2f2f">A · 旧策略（固定 setTargetOffsetMs(3000)）</text>

  <!-- media3 default bar -->
  <text x="60" y="136" font-size="12" fill="#5a6478">media3 默认（不设置偏移 = 3 × 目标时长）</text>
  <g>
    <rect x="60" y="146" width="200" height="26" fill="#d9e8ff" stroke="#7ba7e0"/>
    <rect x="260" y="146" width="200" height="26" fill="#d9e8ff" stroke="#7ba7e0"/>
    <rect x="460" y="146" width="200" height="26" fill="#d9e8ff" stroke="#7ba7e0"/>
    <text x="160" y="163" text-anchor="middle" font-size="11" fill="#33517a">分片 1 (4s)</text>
    <text x="360" y="163" text-anchor="middle" font-size="11" fill="#33517a">分片 2 (4s)</text>
    <text x="560" y="163" text-anchor="middle" font-size="11" fill="#33517a">分片 3 (4s)</text>
    <text x="672" y="163" font-size="11" fill="#8a2f2f" font-weight="700">直播边缘 →</text>
    <polygon points="100,156 92,146 92,166" fill="#2e6fb8"/>
    <line x1="100" y1="178" x2="100" y2="188" stroke="#2e6fb8" stroke-width="1.5"/>
    <text x="100" y="202" text-anchor="middle" font-size="11" fill="#2e6fb8">起播：第 1 片</text>
    <text x="100" y="216" text-anchor="middle" font-size="10.5" fill="#5a6478">身后 3 片缓冲，抗抖</text>
  </g>

  <!-- forced 3000ms bar -->
  <text x="60" y="240" font-size="12" fill="#5a6478">被固定 3000ms 覆盖后（边缘 −3s，再回退到分片起点）</text>
  <g>
    <rect x="60" y="250" width="200" height="26" fill="#f3d9d9" stroke="#d69090"/>
    <rect x="260" y="250" width="200" height="26" fill="#f3d9d9" stroke="#d69090"/>
    <rect x="460" y="250" width="200" height="26" fill="#f3d9d9" stroke="#d69090"/>
    <text x="360" y="267" text-anchor="middle" font-size="11" fill="#8a4a4a">分片 2</text>
    <text x="560" y="267" text-anchor="middle" font-size="11" fill="#8a4a4a">分片 3 ← 起播点</text>
    <line x1="586" y1="236" x2="586" y2="250" stroke="#d64545" stroke-width="2" marker-end="url(#arrR)"/>
    <text x="586" y="228" text-anchor="middle" font-size="11" fill="#d64545" font-weight="700">偏移 3s 落这里</text>
    <text x="672" y="267" font-size="11" fill="#8a2f2f" font-weight="700">直播边缘 →</text>
    <text x="100" y="298" font-size="11.5" fill="#8a2f2f" font-weight="700">→ 身后仅剩 1 片：窗口滑动即滑出（BehindLiveWindow），带宽一抖即击穿缓冲 → 周期性卡顿</text>
  </g>

  <!-- ===== Panel B: 新策略 ===== -->
  <rect x="40" y="312" width="840" height="216" rx="12" fill="#f4faf6" stroke="#bfe3cd"/>
  <text x="60" y="340" font-size="14.5" font-weight="700" fill="#1f6b40">B · 新策略（SourceProfile 按源画像，分片边界定位）</text>
  <g>
    <rect x="60" y="356" width="180" height="26" fill="#d9f0e2" stroke="#79c799"/>
    <rect x="240" y="356" width="180" height="26" fill="#d9f0e2" stroke="#79c799"/>
    <rect x="420" y="356" width="180" height="26" fill="#d9f0e2" stroke="#79c799"/>
    <rect x="600" y="356" width="180" height="26" fill="#d9f0e2" stroke="#79c799"/>
    <text x="150" y="373" text-anchor="middle" font-size="11" fill="#2c6e4c">分片 1</text>
    <text x="330" y="373" text-anchor="middle" font-size="11" fill="#2c6e4c">分片 2</text>
    <text x="510" y="373" text-anchor="middle" font-size="11" fill="#2c6e4c">分片 3</text>
    <text x="690" y="373" text-anchor="middle" font-size="11" fill="#2c6e4c">分片 4</text>
    <text x="792" y="373" font-size="11" fill="#1f6b40" font-weight="700">边缘</text>
    <polygon points="330,366 322,356 322,376" fill="#2e9e5b"/>
    <text x="330" y="404" text-anchor="middle" font-size="11" fill="#1f6b40" font-weight="700">起播：垫 ≈ 2 个平均分片</text>
    <text x="330" y="418" text-anchor="middle" font-size="10.5" fill="#5a6478">身后保留 ≥1 整片，钳制 6~30s</text>
    <line x1="330" y1="382" x2="330" y2="392" stroke="#2e9e5b" stroke-width="1.5"/>
  </g>
  <g>
    <text x="60" y="448" font-size="12" fill="#5a6478">低富余源（实测速度 &lt; 2× 码率需求，如跨洋中转）：垫到窗口的 2/3</text>
    <rect x="60" y="458" width="90" height="20" fill="#e7f3ec" stroke="#79c799"/>
    <rect x="150" y="458" width="90" height="20" fill="#d9f0e2" stroke="#79c799"/>
    <rect x="240" y="458" width="90" height="20" fill="#d9f0e2" stroke="#79c799"/>
    <rect x="330" y="458" width="90" height="20" fill="#d9f0e2" stroke="#79c799"/>
    <rect x="420" y="458" width="90" height="20" fill="#f0f4f7" stroke="#b8c4d4"/>
    <text x="150" y="472" text-anchor="middle" font-size="10" fill="#2c6e4c">←—— 起播垫片 ——→</text>
    <text x="465" y="472" text-anchor="middle" font-size="10" fill="#5a6478">剩余窗口</text>
    <text x="60" y="500" font-size="11.5" fill="#1f6b40">伪实时代价（晚 ~10-20s）换取带宽波动期不击穿缓冲；富余充足的源仍维持薄垫片</text>
    <text x="60" y="518" font-size="11.5" fill="#5a6478">配套：分片级 404/超时改 300ms×4 短退避（默认策略 0/1/2s = 一片坏冻结 3 秒）；直连 TS 流保底，HLS 源永远排前</text>
  </g>
</svg>
