<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5a6478"/></marker>
    <marker id="bG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2e9e5b"/></marker>
    <marker id="bB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2e6fb8"/></marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2433">运行时重缓冲反馈 —— 让实播表现参与选源决策</text>
  <text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#5a6478">探测快照会漏掉「测得快、播着卡」的源；把播放期的真实重缓冲按 URL 记入画像，闭环反馈到排序与换选</text>

  <!-- probe box -->
  <rect x="60" y="96" width="240" height="118" rx="12" fill="#eef2f9" stroke="#8fa3c4"/>
  <text x="180" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c2433">探测期（快照）</text>
  <text x="180" y="146" text-anchor="middle" font-size="11.5" fill="#5a6478">建连耗时 · 实测速率 · 富余倍数</text>
  <text x="180" y="166" text-anchor="middle" font-size="11.5" fill="#5a6478">窗口 / 分片结构 · 直连保底</text>
  <text x="180" y="192" text-anchor="middle" font-size="11" fill="#8a99b3">盲区：单次测速好 ≠ 实播不卡</text>

  <!-- runtime box -->
  <rect x="60" y="268" width="240" height="118" rx="12" fill="#f4faf6" stroke="#79c799"/>
  <text x="180" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6b40">播放期（实播裁决）</text>
  <text x="180" y="318" text-anchor="middle" font-size="11.5" fill="#2c6e4c">READY → BUFFERING 换向计数</text>
  <text x="180" y="338" text-anchor="middle" font-size="11.5" fill="#2c6e4c">按 URL 记入 SourceProfiles.stalls</text>
  <text x="180" y="364" text-anchor="middle" font-size="11" fill="#5a6478">初缓冲 / 换台重置不误计</text>

  <!-- ranking box -->
  <rect x="400" y="96" width="220" height="118" rx="12" fill="#fbf3e6" stroke="#d9a85f"/>
  <text x="510" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5a1f">探测排序</text>
  <text x="510" y="146" text-anchor="middle" font-size="11.5" fill="#8a5a1f">小窗口 → stalls 降权</text>
  <text x="510" y="166" text-anchor="middle" font-size="11.5" fill="#8a5a1f">→ 富余 → 速率 → 建连</text>
  <text x="510" y="192" text-anchor="middle" font-size="11" fill="#8a5a1f">劣迹跨探测周期保留</text>

  <!-- switch box -->
  <rect x="400" y="268" width="220" height="118" rx="12" fill="#f0f4fb" stroke="#7ba7e0"/>
  <text x="510" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2e4e82">换台自动换选</text>
  <text x="510" y="318" text-anchor="middle" font-size="11.5" fill="#33517a">当前源 stalls ≥ 2 且有</text>
  <text x="510" y="338" text-anchor="middle" font-size="11.5" fill="#33517a">更干净备选 → 换选</text>
  <text x="510" y="364" text-anchor="middle" font-size="11" fill="#5a6478">prefer stall-free source</text>

  <!-- outcome box -->
  <rect x="700" y="180" width="180" height="122" rx="12" fill="#f4faf6" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="790" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6b40">流畅播放</text>
  <text x="790" y="234" text-anchor="middle" font-size="11.5" fill="#2c6e4c">卡源两次内自动让位</text>
  <text x="790" y="254" text-anchor="middle" font-size="11.5" fill="#2c6e4c">自愈，观看无感</text>
  <text x="790" y="282" text-anchor="middle" font-size="10.5" fill="#5a6478">真机闭环实测验证</text>

  <!-- arrows -->
  <line x1="300" y1="155" x2="396" y2="155" stroke="#5a6478" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="300" y1="327" x2="396" y2="327" stroke="#5a6478" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="510" y1="214" x2="510" y2="264" stroke="#8a99b3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b1)"/>
  <line x1="620" y1="327" x2="700" y2="290" stroke="#2e9e5b" stroke-width="2.4" marker-end="url(#bG)"/>
  <line x1="620" y1="155" x2="700" y2="196" stroke="#2e6fb8" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#bB)"/>
  <!-- feedback loop: outcome -> runtime -->
  <path d="M 790 302 L 790 420 L 180 420 L 180 390" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#bG)"/>
  <text x="470" y="440" text-anchor="middle" font-size="11.5" fill="#1f6b40">闭环：播放中的每一次重缓冲都会沉淀为该源的劣迹，下次选源自动避开</text>

  <!-- bottom evidence -->
  <rect x="60" y="424" width="800" height="0" fill="none"/>
  <text x="460" y="456" text-anchor="middle" font-size="11.5" fill="#5a6478">实测：卡源 110s 记 3 次重缓冲 → 换台再进入自动换选干净源 → 之后 110s 零重缓冲；22 次快速换台零误计</text>
</svg>
